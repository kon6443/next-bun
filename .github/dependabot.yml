# GitHub Actions 버전 갱신 — 월 1회, PR 1개로 묶음, 메이저 업데이트는 제외(필요 시 사람이 직접 올린다)
# SHA로 고정한 액션도 주석의 버전을 따라 갱신된다
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(ci)"
  # Dockerfile 베이스 이미지(node:24.x.y-bookworm-slim) 갱신 — 주 1회, 메이저 업데이트는 제외(Node 메이저는 사람이 직접 올린다)
  # 두 FROM(base·production)이 같은 태그라 한 PR에서 같이 오른다
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(infra)"
