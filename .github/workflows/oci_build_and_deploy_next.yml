name: Deploy Next to Docker Swarm

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  # PR 에서는 verify 만 돈다 (deploy 는 아래 if 로 막는다)
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  workflow_dispatch:

# 기본 GITHUB_TOKEN 권한을 읽기로 제한한다 (이 워크플로는 저장소에 쓰지 않는다)
permissions:
  contents: read

# PR 은 새 push 가 오면 이전 실행(verify)을 취소한다. main push·수동 실행은 실행마다 그룹이 달라 취소되지 않는다(배포 중단 금지)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 디펜스 개발용 장기 스위트(차등 코퍼스·병렬 시뮬·스모크, 합쳐 테스트 시간의 절반 이상) — verify-sim 잡이 같은 커밋에서 따로 돌리고
  # verify 는 뺀다. 두 잡의 합이 전체 테스트다. 파일 이름이 바뀌면 그 파일은 exclude 에 걸리지 않아 verify 에서 돈다(빠지지 않는다).
  # 셋 다 사라지면 verify-sim 이 0개를 찾아 vitest 가 실패한다 — 그때 이 목록을 고친다
  SLOW_TESTS: >-
    src/app/games/defense/engine-dev/corpus/corpus.test.ts
    src/app/games/defense/engine-dev/sim/pool.test.ts
    src/app/games/defense/engine-dev/sim/smoke.test.ts

jobs:
  # 배포 전 게이트: lint·typecheck·test(verify·verify-sim) 가 실패하면 배포로 넘어가지 않는다.
  # build 는 아래 Docker 빌드(Dockerfile 의 Node `next build`)가 수행하므로 여기서 중복하지 않는다.
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 를 따른다 (Dockerfile 의 corepack 과 같은 버전).
      # setup-node 의 cache: pnpm 이 pnpm 바이너리를 찾으므로 setup-node 보다 먼저 둔다
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # next·tsc·vitest bin 은 `#!/usr/bin/env node` 라 러너 기본 Node 로 돈다 — 메이저를 고정해 비결정성을 없애고 백엔드 런타임(Node 24)과 맞춘다
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Show Node and pnpm version
        run: which node && node -v && pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 장기 스위트(SLOW_TESTS)는 verify-sim 이 돌린다
      - name: Test
        run: |
          read -ra slow <<< "$SLOW_TESTS"
          args=()
          for file in "${slow[@]}"; do args+=(--exclude "$file"); done
          pnpm test:run "${args[@]}"

  # 장기 스위트만 — verify 와 동시에 돈다(디펜스 엔진 결정성 검증 범위는 그대로)
  verify-sim:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (slow suites)
        run: |
          read -ra slow <<< "$SLOW_TESTS"
          pnpm test:run "${slow[@]}"

  # 이미지 빌드는 verify 결과를 쓰지 않는다(Dockerfile 안에서 따로 install·build) — verify 와 동시에 돌려 배포까지의 시간을 줄인다.
  # verify 가 실패하면 deploy 가 돌지 않아 이 이미지는 배포되지 않는다(SHA 태그 이미지만 레지스트리에 남는다)
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    # 레지스트리·카카오 키 시크릿이 prod environment 범위다(저장소 시크릿 없음).
    # prod 에 승인 규칙을 걸면 build 도 승인을 기다려 병렬 효과가 사라진다 — 그때는 시크릿을 build 전용 environment 로 나눈다
    environment: prod
    outputs:
      image-tag: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 시크릿은 run 스크립트에 직접 보간하지 않고 env 로 넘긴다 (셸 인젝션 표면 축소)
      - name: Log in to Docker Registry
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and Push arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/prod_next:${{ steps.sha.outputs.short }}
          build-args: |
            NEXT_PUBLIC_BUILD_SHA=${{ steps.sha.outputs.short }}
            NEXT_PUBLIC_KAKAO_JS_KEY=${{ secrets.KAKAO_JS_KEY }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 배포 본체는 재사용 워크플로(deploy-prod-next.yml) — 수동 롤백(rollback-prod-next.yml)과 같은 경로를 쓴다.
  # environment(prod)는 재사용 워크플로의 잡이 가진다(uses 잡에는 둘 수 없다)
  deploy:
    needs: [verify, verify-sim, build]
    if: github.event_name != 'pull_request'
    # 배포 두 개가 동시에 stack deploy 하지 않게 하나씩 — 진행 중 배포는 끊지 않는다. 대기는 1개뿐이라 나중에 들어온 것이 대기 중인 것을 취소한다
    # (실행 순서까지 보장하지는 않는다: 옛 push 의 verify·build 가 늦게 끝나면 옛 SHA 가 나중에 배포될 수 있다)
    # 수동 롤백(rollback-prod-next.yml)도 같은 그룹이라, 롤백을 실행하면 대기 중이던 push 배포가 취소된다(반대도 같다).
    # 재사용 워크플로 안에는 두지 않는다(같은 그룹을 안팎에서 잡으면 교착)
    concurrency:
      group: deploy-prod-next
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-prod-next.yml
    with:
      image_tag: ${{ needs.build.outputs.image-tag }}
    secrets: inherit
