name: Deploy Next to Docker Swarm

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  # PR 에서는 verify 만 돈다 (deploy 는 아래 if 로 막는다)
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  workflow_dispatch:

# 기본 GITHUB_TOKEN 권한을 읽기로 제한한다 (이 워크플로는 저장소에 쓰지 않는다)
permissions:
  contents: read

# PR 은 새 push 가 오면 이전 실행(verify)을 취소한다. main push·수동 실행은 실행마다 그룹이 달라 취소되지 않는다(배포 중단 금지)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 디펜스 개발용 장기 스위트(차등 코퍼스·병렬 시뮬·스모크, 합쳐 테스트 시간의 절반 이상) — verify-sim 잡이 같은 커밋에서 따로 돌리고
  # verify 는 뺀다. 두 잡의 합이 전체 테스트다. 파일 이름이 바뀌면 그 파일은 exclude 에 걸리지 않아 verify 에서 돈다(빠지지 않는다).
  # 셋 다 사라지면 verify-sim 이 0개를 찾아 vitest 가 실패한다 — 그때 이 목록을 고친다
  SLOW_TESTS: >-
    src/app/games/defense/engine-dev/corpus/corpus.test.ts
    src/app/games/defense/engine-dev/sim/pool.test.ts
    src/app/games/defense/engine-dev/sim/smoke.test.ts

jobs:
  # 배포 전 게이트: lint·typecheck·test(verify·verify-sim) 가 실패하면 배포로 넘어가지 않는다.
  # build 는 아래 Docker 빌드(Dockerfile 의 Node `next build`)가 수행하므로 여기서 중복하지 않는다.
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 를 따른다 (Dockerfile 의 corepack 과 같은 버전).
      # setup-node 의 cache: pnpm 이 pnpm 바이너리를 찾으므로 setup-node 보다 먼저 둔다
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # next·tsc·vitest bin 은 `#!/usr/bin/env node` 라 러너 기본 Node 로 돈다 — 메이저를 고정해 비결정성을 없애고 백엔드 런타임(Node 24)과 맞춘다
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Show Node and pnpm version
        run: which node && node -v && pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 장기 스위트(SLOW_TESTS)는 verify-sim 이 돌린다
      - name: Test
        run: |
          read -ra slow <<< "$SLOW_TESTS"
          args=()
          for file in "${slow[@]}"; do args+=(--exclude "$file"); done
          pnpm test:run "${args[@]}"

  # 장기 스위트만 — verify 와 동시에 돈다(디펜스 엔진 결정성 검증 범위는 그대로)
  verify-sim:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (slow suites)
        run: |
          read -ra slow <<< "$SLOW_TESTS"
          pnpm test:run "${slow[@]}"

  # 이미지 빌드는 verify 결과를 쓰지 않는다(Dockerfile 안에서 따로 install·build) — verify 와 동시에 돌려 배포까지의 시간을 줄인다.
  # verify 가 실패하면 deploy 가 돌지 않아 이 이미지는 배포되지 않는다(SHA 태그 이미지만 레지스트리에 남는다)
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    # 레지스트리·카카오 키 시크릿이 prod environment 범위다(저장소 시크릿 없음).
    # prod 에 승인 규칙을 걸면 build 도 승인을 기다려 병렬 효과가 사라진다 — 그때는 시크릿을 build 전용 environment 로 나눈다
    environment: prod
    outputs:
      image-tag: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 시크릿은 run 스크립트에 직접 보간하지 않고 env 로 넘긴다 (셸 인젝션 표면 축소)
      - name: Log in to Docker Registry
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and Push arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/prod_next:${{ steps.sha.outputs.short }}
          build-args: |
            NEXT_PUBLIC_BUILD_SHA=${{ steps.sha.outputs.short }}
            NEXT_PUBLIC_KAKAO_JS_KEY=${{ secrets.KAKAO_JS_KEY }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [verify, verify-sim, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    environment: prod
    # 배포 두 개가 동시에 stack deploy 하지 않게 하나씩 — 진행 중 배포는 끊지 않고 대기열로
    # (실행 순서까지 보장하지는 않는다: 옛 push 의 verify·build 가 늦게 끝나면 옛 SHA 가 나중에 배포될 수 있다)
    concurrency:
      group: deploy-prod-next
      cancel-in-progress: false

    steps:
      # 스택 YAML(infra/) 을 서버로 보내려고 받는다
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rsync stack YAML to Swarm manager
        env:
          SSH_KEY: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          rsync -avz \
            -e "ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no" \
            infra/docker-stack.app.yml \
            "$DEPLOY_USER@$DEPLOY_SERVER:/home/ubuntu/desktop/deploy/infra/prod_next.yml"
          rm /tmp/ssh_key

      - name: Deploy stack + wait for converge via SSH
        # 서드파티 액션이 SSH 키를 받으므로 태그가 아닌 커밋 SHA 로 고정한다 (Dependabot 은 같은 줄 끝 버전 주석을 읽는다)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          # 기본 10m 이면 스크립트의 15분 대기보다 먼저 세션이 끊겨 판정·진단 출력 없이 실패한다
          command_timeout: 20m
          # --detach=false 로 롤링 업데이트가 끝날 때까지 기다린 뒤, 결과는 UpdateStatus 로 판정한다.
          # (detach 없이 Replicas 만 보면 교체 전 기존 태스크를 세어 실패 배포도 성공으로 남았다)
          script: |
            set -euo pipefail
            export REGISTRY_URL=${{ secrets.REGISTRY_URL }}
            export IMAGE_TAG=${{ needs.build.outputs.image-tag }}
            # build 잡 출력이 비면(시크릿 마스킹 등) 잘못된 이미지 참조로 배포하지 않게 바로 멈춘다
            [ -n "$IMAGE_TAG" ] || { echo "Deploy failed: image tag 비어 있음"; exit 1; }

            SERVICE=prod_next_app
            DEADLINE=$((SECONDS + 900))   # 전체 대기 상한 15분

            fail() {
              echo "Deploy failed: $1"
              docker service ps "$SERVICE" --no-trunc | head -20 || true
              exit 1
            }

            # 원격 호스트와 Swarm 리더의 시계 차이를 감안해 30초 여유를 둔다 (concurrency 로 배포는 겹치지 않는다)
            DEPLOY_STARTED=$(( $(date -u +%s) - 30 ))
            timeout 900 docker stack deploy --detach=false \
              -c /home/ubuntu/desktop/deploy/infra/prod_next.yml \
              --with-registry-auth \
              prod_next || fail "stack deploy 실패 또는 시간 초과"

            # UpdateStatus 는 이전 배포 값이 남는다 — 이번 배포에서 시작된 업데이트가 아니면(최초 생성·같은 SHA 재실행)
            # 상태 대신 Replicas 로 판정한다
            while :; do
              # set -e 로 진단 없이 끝나지 않게 inspect 실패를 직접 처리한다
              STATE=$(docker service inspect "$SERVICE" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}') \
                || fail "service inspect 실패"
              UPDATE_STARTED=$(docker service inspect "$SERVICE" --format '{{if .UpdateStatus}}{{if .UpdateStatus.StartedAt}}{{.UpdateStatus.StartedAt.Unix}}{{else}}0{{end}}{{else}}0{{end}}') \
                || fail "service inspect 실패"
              [ "$UPDATE_STARTED" -ge "$DEPLOY_STARTED" ] || STATE=""
              case "$STATE" in
                completed)
                  echo "Update completed"
                  break ;;
                "")
                  REPLICAS=$(docker service ls --filter "name=$SERVICE" --format '{{.Replicas}}' | head -1)
                  if [ "${REPLICAS%%/*}" = "${REPLICAS##*/}" ] && [ "${REPLICAS%%/*}" != "0" ]; then
                    echo "No update in this deploy, replicas: $REPLICAS"
                    break
                  fi ;;
                updating|rollback_started)
                  ;;
                *)
                  fail "UpdateStatus=$STATE" ;;
              esac
              [ "$SECONDS" -lt "$DEADLINE" ] || fail "대기 상한 초과 (UpdateStatus=${STATE:-none})"
              sleep 5
            done

            docker stack services prod_next
