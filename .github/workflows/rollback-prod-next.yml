name: Rollback Next (redeploy image tag)

# ⚠️ DB 스키마·API 계약이 바뀐 배포 이전으로 되돌릴 때는 백엔드 호환을 먼저 확인할 것.
#    프론트 이미지만 옛 버전으로 돌아가고 백엔드(prod_nest)는 그대로다.
#
# 레지스트리에 이미 있는 prod_next:<태그> 이미지를 정상 배포와 같은 경로(deploy-prod-next.yml)로 다시 배포한다. 이미지는 새로 빌드하지 않는다.
# - 태그 형식: 커밋 SHA 앞 7자리 소문자 16진수 — 빌드 잡의 `${GITHUB_SHA::7}`(oci_build_and_deploy_next.yml)과 같다.
#   이 형식의 prod_next 태그는 6237d6b(2026-04-17, Swarm 스택 전환)부터 있다. 그 전 이미지는 sys_next:latest 라 여기서 고를 수 없다.
# - 아키텍처: prod_next 태그는 모두 linux/arm64 단일 아키텍처다. 멀티아치(amd64+arm64, QEMU) 빌드는
#   c0119f3(2025-11-27)~b1ca376(2026-01-31) 사이 sys_next:latest 에만 있었고, 이후 arm64 전용 → e7e8374(2026-03-23)부터 arm64 러너 네이티브 빌드다.
#   운영 노드(node.labels.prod_next == 1)가 arm64 이므로 고를 수 있는 태그는 모두 실행 가능하다.
# - 스택 YAML 은 지금 main 의 것을 쓴다(이미지 태그만 바뀐다). healthcheck 는 이미지 안의 `node` 로 /api/health 를 부른다 —
#   운영 런타임을 Bun 에서 Node 로 바꾼 3d9dbd6(2026-10-19) 이전 이미지(oven/bun)는 healthcheck 가 실패해 Swarm 이 되돌릴 수 있다.
#   그보다 옛 태그로 되돌려야 하면 그때의 스택 YAML 호환부터 확인한다.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 되돌릴 이미지 태그 (커밋 SHA 앞 7자리, 예 c229eb7)
        type: string
        required: true

permissions:
  contents: read

jobs:
  # 배포 전 확인 — 하나라도 실패하면 deploy 로 넘어가지 않는다
  guard:
    runs-on: ubuntu-24.04-arm
    # 레지스트리 시크릿이 prod environment 범위다(저장소 시크릿 없음)
    environment: prod
    steps:
      # 입력은 run 스크립트에 직접 보간하지 않고 env 로 넘긴다 (셸 인젝션 표면 축소)
      - name: Check branch is main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::롤백은 main 에서만 실행한다 (현재 $GITHUB_REF)"
            exit 1
          fi

      - name: Check image tag format
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "::error::이미지 태그는 커밋 SHA 앞 7자리 소문자 16진수여야 한다"
            exit 1
          fi

      - name: Log in to Docker Registry
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Check image exists in registry
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! docker manifest inspect "$REGISTRY_URL/prod_next:$IMAGE_TAG" > /dev/null; then
            echo "::error::prod_next:$IMAGE_TAG 이미지를 확인하지 못했다 — 태그가 없거나 레지스트리 접근 실패(위 docker 출력 참고)"
            exit 1
          fi

  deploy:
    needs: guard
    # 정상 배포(oci_build_and_deploy_next.yml 의 deploy)와 같은 그룹 — 배포와 롤백이 동시에 stack deploy 하지 않는다.
    # 그룹의 대기는 1개뿐이다: 나중에 들어온 배포·롤백이 대기 중인 것을 취소한다(진행 중인 것은 끊지 않는다)
    # 재사용 워크플로 안에는 두지 않는다(같은 그룹을 안팎에서 잡으면 교착)
    concurrency:
      group: deploy-prod-next
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-prod-next.yml
    with:
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
