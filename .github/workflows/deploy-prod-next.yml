name: Deploy prod_next stack (reusable)

# 배포 잡 본체 — 정상 배포(oci_build_and_deploy_next.yml)와 수동 롤백(rollback-prod-next.yml)이 같은 경로를 쓴다.
# concurrency 는 여기 두지 않는다: 호출하는 잡이 이미 deploy-prod-next 그룹을 잡고 있어, 여기서 같은 그룹을 또 잡으면
# 호출 쪽이 끝나기를 서로 기다리며 멈춘다(교착). 배포·롤백 직렬화는 호출하는 잡의 concurrency 가 맡는다.
# 체크아웃되는 것은 호출한 실행의 커밋이다 — 롤백이어도 스택 YAML 은 그 시점 main 의 것을 쓴다(이미지 태그만 바뀐다).

on:
  workflow_call:
    inputs:
      image_tag:
        description: 배포할 이미지 태그 (prod_next:<커밋 SHA 앞 7자리>)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: prod

    steps:
      # 태그는 아래 ssh 스크립트에 그대로 보간된다 — 이 step에서 형식(SHA 7자)을 먼저 확인해 셸 주입을 막는다.
      # 검사 자체는 입력을 env로만 다룬다. 이 step이 실패하면 서버에 접속하지 않는다
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "이미지 태그 형식 오류(커밋 SHA 앞 7자리여야 함)"
            exit 1
          fi

      # 스택 YAML(infra/) 을 서버로 보내려고 받는다
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rsync stack YAML to Swarm manager
        env:
          SSH_KEY: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          rsync -avz \
            -e "ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no" \
            infra/docker-stack.app.yml \
            "$DEPLOY_USER@$DEPLOY_SERVER:/home/ubuntu/desktop/deploy/infra/prod_next.yml"
          rm /tmp/ssh_key

      - name: Deploy stack + wait for converge via SSH
        # 서드파티 액션이 SSH 키를 받으므로 태그가 아닌 커밋 SHA 로 고정한다 (Dependabot 은 같은 줄 끝 버전 주석을 읽는다)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          # 기본 10m 이면 스크립트의 15분 대기보다 먼저 세션이 끊겨 판정·진단 출력 없이 실패한다
          command_timeout: 20m
          # --detach=false 로 롤링 업데이트가 끝날 때까지 기다린 뒤, 결과는 UpdateStatus 로 판정한다.
          # (detach 없이 Replicas 만 보면 교체 전 기존 태스크를 세어 실패 배포도 성공으로 남았다)
          script: |
            set -euo pipefail
            export REGISTRY_URL=${{ secrets.REGISTRY_URL }}
            export IMAGE_TAG=${{ inputs.image_tag }}
            # 태그가 비면(빌드 잡 출력의 시크릿 마스킹 등) 잘못된 이미지 참조로 배포하지 않게 바로 멈춘다
            [ -n "$IMAGE_TAG" ] || { echo "Deploy failed: image tag 비어 있음"; exit 1; }

            SERVICE=prod_next_app
            DEADLINE=$((SECONDS + 900))   # 전체 대기 상한 15분

            fail() {
              echo "Deploy failed: $1"
              docker service ps "$SERVICE" --no-trunc | head -20 || true
              exit 1
            }

            # 원격 호스트와 Swarm 리더의 시계 차이를 감안해 30초 여유를 둔다 (concurrency 로 배포는 겹치지 않는다)
            DEPLOY_STARTED=$(( $(date -u +%s) - 30 ))
            timeout 900 docker stack deploy --detach=false \
              -c /home/ubuntu/desktop/deploy/infra/prod_next.yml \
              --with-registry-auth \
              prod_next || fail "stack deploy 실패 또는 시간 초과"

            # UpdateStatus 는 이전 배포 값이 남는다 — 이번 배포에서 시작된 업데이트가 아니면(최초 생성·같은 SHA 재실행)
            # 상태 대신 Replicas 로 판정한다
            while :; do
              # set -e 로 진단 없이 끝나지 않게 inspect 실패를 직접 처리한다
              STATE=$(docker service inspect "$SERVICE" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}') \
                || fail "service inspect 실패"
              UPDATE_STARTED=$(docker service inspect "$SERVICE" --format '{{if .UpdateStatus}}{{if .UpdateStatus.StartedAt}}{{.UpdateStatus.StartedAt.Unix}}{{else}}0{{end}}{{else}}0{{end}}') \
                || fail "service inspect 실패"
              [ "$UPDATE_STARTED" -ge "$DEPLOY_STARTED" ] || STATE=""
              case "$STATE" in
                completed)
                  echo "Update completed"
                  break ;;
                "")
                  REPLICAS=$(docker service ls --filter "name=$SERVICE" --format '{{.Replicas}}' | head -1)
                  if [ "${REPLICAS%%/*}" = "${REPLICAS##*/}" ] && [ "${REPLICAS%%/*}" != "0" ]; then
                    echo "No update in this deploy, replicas: $REPLICAS"
                    break
                  fi ;;
                updating|rollback_started)
                  ;;
                *)
                  fail "UpdateStatus=$STATE" ;;
              esac
              [ "$SECONDS" -lt "$DEADLINE" ] || fail "대기 상한 초과 (UpdateStatus=${STATE:-none})"
              sleep 5
            done

            docker stack services prod_next
