version: '3.9'

services:
  app:
    image: ${REGISTRY_URL}/prod_next:${IMAGE_TAG}
    networks:
      - sys_default
    env_file:
      - /home/ubuntu/desktop/deploy/sys/config/env/.env
    environment:
      HOSTNAME: "0.0.0.0"
      # 서버 사이드 백엔드 호출(로그인)은 공인 도메인 헤어핀 대신 같은 overlay 내부 주소로 직행한다
      # (src/services/serverFetch.ts — 없으면 NEXT_PUBLIC_API 로 폴백). 사용자 IP 전달(X-Forwarded-For)과 같이 배포해야 한다
      SERVER_API_BASE: "http://prod_nest_app:3500"
    ports:
      - target: 3000
        published: 23000
        mode: ingress
    healthcheck:
      # 런타임 이미지가 node 다 (Dockerfile 과 같은 커밋으로 바꿔야 롤링이 깨지지 않는다).
      # node -e 는 CommonJS 라 최상위 await 대신 then 으로 쓴다
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 4
      placement:
        constraints:
          - node.labels.prod_next == 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 5s
        max_failure_ratio: 0
      restart_policy:
        condition: on-failure
        delay: 10s

networks:
  sys_default:
    external: true
